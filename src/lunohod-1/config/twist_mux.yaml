# Twist Mux Configuration for micro-ROS Integration
# Output is remapped to /cmd_vel for direct ESP32 consumption
twist_mux:
  ros__parameters:
    use_stamped: false  # ESP32 expects geometry_msgs/Twist, not TwistStamped
    topics:
      navigation:
        topic   : nav_vel
        timeout : 0.5
        priority: 10
      joystick:
        topic   : cmd_vel_joy
        timeout : 0.5
        priority: 100